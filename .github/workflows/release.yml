name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-

      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: |
            .gradle
            app/build
          key: ${{ runner.os }}-gradle-build-${{ hashFiles('**/*.kt', '**/*.java', '**/*.xml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-

      - name: Enable Gradle build cache
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=true" >> ~/.gradle/gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup keystore for signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PROPERTIES" ]; then
            echo "❌ KEYSTORE_BASE64 и KEYSTORE_PROPERTIES обязательны для тэг-релиза."
            echo "   Без production keystore APK не сможет обновить ранее установленную версию."
            echo "   Настройте секреты по инструкции в keystores/README.md."
            exit 1
          fi
          mkdir -p keystores
          echo "$KEYSTORE_BASE64" | base64 -d > keystores/partyinpocket-release.keystore
          printf '%s' "$KEYSTORE_PROPERTIES" > keystore.properties
          echo "✅ Production keystore configured"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK files
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PartyInPocket-v${{ steps.version.outputs.VERSION }}-debug.apk
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/PartyInPocket-v${{ steps.version.outputs.VERSION }}.apk

      - name: Read changelog
        id: changelog
        run: |
          CHANGELOG_FILE="for_release/v${{ steps.version.outputs.VERSION }}/CHANGELOG.md"
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            cat "$CHANGELOG_FILE" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG=_Описание изменений не добавлено_" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/release/PartyInPocket-v${{ steps.version.outputs.VERSION }}.apk
            app/build/outputs/apk/debug/PartyInPocket-v${{ steps.version.outputs.VERSION }}-debug.apk
          body: |
            ## Вечеринка в кармане v${{ steps.version.outputs.VERSION }}

            ### 📦 Файлы
            - **PartyInPocket-v${{ steps.version.outputs.VERSION }}.apk** - Release версия (оптимизированная)
            - **PartyInPocket-v${{ steps.version.outputs.VERSION }}-debug.apk** - Debug версия

            ### 🚀 Установка
            1. Скачайте release APK
            2. Разрешите установку из неизвестных источников в настройках Android
            3. Установите приложение

            ---

            ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
